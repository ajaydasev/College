<!DOCTYPE html>
<html>
	<head>
		<title>Math object and String Object</title>
		<style>
			body {
				font-family: Arial, sans-serif;
				padding: 20px;
		</style>
	</head>
	<body>
		<center><h2>String functions</h2></center>
		<script>
			var str="Hello World!";
			document.write("Original string:"+str+"<br>");
			document.write("LenGth of string:"+str.length+"<br>");
			document.write("Uppercase:"+str.toUpperCase()+"<br>");
			document.write("Lowercase:"+str.toLowerCase()+"<br>");
			document.write("Character at position 1:"+str.charAt(1)+"<br>");
			document.write("Substring:"+str.substring(0,5)+"<br>");
			document.write("<h2>Math functions</h2>");
			var num=16.7;
			
			document.write("Number:"+num+"<br>");
			document.write("Round:"+Math.round(num)+"<br>");
			document.write("Ceiling:"+Math.ceil(num)+"<br>");
			document.write("Floor:"+Math.floor(num)+"<br>");
			document.write("Square root of 25:"+Math.sqrt(25)+"<br>");
			document.write("Power of 2 and 3:"+Math.pow(2,3)+"<br>");
			document.write("Absolute of -10:"+Math.abs(-10)+"<br>");
			document.write("Random number:"+Math.random()+"<br>");
		</script>
	</body>
</html>
