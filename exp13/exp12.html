<!DOCTYPE html>
<html>
	<head>
		<title>Navbar</title>
		<style>
			body{
				margin:0;
				}
			.sidenav{
					height:100%;
					width:160px;
					padding-top:20px;
					background-color:green;
					position:fixed;
					top:0;
					left:0;
				}
			.sidenav a{
					display:block;
					padding:6px 8px 6px 16px;
					color:white;
				}
				
			.sidenav a:hover{
						color:red;
					}
			.main{
				padding:0px 10px;
				margin-left:160px;
				height:2000px;
				}
				
				
									
								
		</style>
	</head>
	
	<body>
		<div  class="sidenav">
			<a href="#about">About Us</a>
			<a href="#">Department</a>
			<a href="#">Vision and Mission</a>
			<a href="#">Conatact Us</a>
		</div>
		<div class="main">
			<h1>Side bar example</h1>
		</div>
	</body>
</html>
