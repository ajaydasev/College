<!DOCTYPE html>
<html>
	<head>
		<title>Mouse Click Events</title>
		<style>
			h1{
				text-align:center;
				color:red;
			}
			button{
				color:blue;
				}	
		</style>		
		
		
		<script>
		
			function dc()
			{
				document.body.style.backgroundColor="green"
			}
			function sc()
			{
				document.body.style.backgroundColor="red"
			}
		</script>
	</head>
		
		
	<body>
		<h1>Change Background Color</h1>
		<button ondblclick="dc()"
			onclick="sc()">
			Change Background Color</button>
	</body>
</html>
