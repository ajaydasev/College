<!DOCTYPE html>
<html>
	<head>
		<title>Strripped table</title>
	<style>
	
		h1{
			text-align:center;
			color:red;
		}
		#stdtable{
				width:80%;
				font-family:ariel,sans-serif;
				border-collapse:collapse;
			}
		#stdtable th{
				padding:20px;
				text-align:left;
				background-color:green;
				color:white;
				border:1px solid black;
			}
		#stdtable td{
				padding:10px;
				border:1px solid black;
			}
		#stdtable tr{
				border:1px solid black;
				}
		#stdtable tr:hover{
					background-color:yellow;
					}
					
		tr:nth-child(even){
					background-color:lightgrey;
					}
												
									
	</style>
	
	</head>
	<body>
		<h1>Student Details</h1>
		<table id="stdtable">
			<tr>
				<th>Name</th>
				<th>Branch</th>
				<th>Age</th>
			</tr>
			<tr>
				<td>Ajay</td>
				<td>MCA</td>
				<td>21</td>
			</tr>
			<tr>
				<td>Rahul</td>
				<td>B.tech CS</td>
				<td>23</td>
			</tr>
			
			<tr>
				<td>Varun</td>
				<td>B.tech ECE</td>
				<td>20</td>
			</tr>
			<tr>
				<td>Vijay</td>
				<td>B.tech EEE</td>
				<td>19</td>
			</tr>
		</table>	
						
	</body>
<html>
